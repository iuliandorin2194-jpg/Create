<style>
:root{--bg:#14171a;--card:#1d2226;--card2:#252b30;--line:#323a40;--tx:#e8eaed;--mut:#9aa3ab;--acc:#f5a524;--ok:#3ecf8e;--ko:#ff6b5b;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:16px 16px 8px;display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
header svg{width:34px;height:34px;flex:none}
header h1{font-size:19px;letter-spacing:.2px}
header small{display:block;color:var(--mut);font-size:12px;font-weight:400}
main{padding:0 12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0}
h2{font-size:16px;margin-bottom:8px}
h3{font-size:14px;color:var(--mut);font-weight:600;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
textarea{height:120px;font-size:13px;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:#14171a;border-color:var(--acc);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:var(--acc);color:#14171a;cursor:pointer;margin-top:14px}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:10px;font-size:14px;margin-top:10px}
.mini{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer;white-space:nowrap}
.mini.on{border-color:var(--ok);color:var(--ok)}
.btns{display:flex;gap:6px;flex:none}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.big{font-size:26px;font-weight:800}
.big span{font-size:13px;color:var(--mut);font-weight:500}
.sub{font-size:13px;color:var(--mut);margin-top:6px}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.daytabs .chip{flex:none;position:relative}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar i.ok{background:var(--ok)}
.meter{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.meter b{color:var(--tx)}
.status{border-radius:10px;padding:9px 11px;font-size:14px;margin-top:10px}
.status.ok{background:rgba(62,207,142,.12);color:var(--ok)}
.status.ko{background:rgba(255,107,91,.12);color:var(--ko)}
.status.warn{background:rgba(245,165,36,.12);color:var(--acc)}
.status.info{background:var(--card2);color:var(--tx)}
.meal{border-top:1px solid var(--line);padding:12px 0 4px}
.meal:first-of-type{border-top:0}
.meal.eaten .nm,.meal.eaten .food{opacity:.55}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mh .slot{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.mh .nm{font-weight:650}
.food{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0;color:#cfd4d8}
.food em{font-style:normal;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.mm{font-size:12px;color:var(--mut);margin-top:4px}
.tags{font-size:12px;color:var(--mut);margin-top:3px}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li input{width:20px;height:20px;flex:none;accent-color:var(--acc)}
.li label{margin:0;font-size:14px;color:var(--tx);flex:1;min-width:0;cursor:pointer}
.li label small{display:block;color:var(--mut);font-size:12px}
.li.done label{text-decoration:line-through;color:var(--mut)}
.pr{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:8px;padding:5px 8px;font-size:13px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.pr.mine{border-color:var(--acc);color:var(--acc)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tot b{font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0f1214;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--acc)}
.note{font-size:12px;color:var(--mut);margin:14px 4px 20px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
details{margin-top:6px;background:var(--card2);border-radius:10px;padding:2px 10px}
details[open]{padding-bottom:10px}
summary{cursor:pointer;color:var(--acc);font-size:13px;padding:7px 0;font-weight:600}
.steps{padding-left:20px;font-size:14px;color:#cfd4d8;margin-top:8px}
.steps li{margin:4px 0}
.kid{font-size:13px;color:var(--tx);background:rgba(62,207,142,.1);border-radius:8px;padding:7px 9px;margin-top:8px}
.leftover{font-size:12px;color:var(--acc);margin-top:4px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:14px}
.stepper span:last-child{display:flex;align-items:center;gap:12px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:18px;cursor:pointer}
.stepper b{min-width:14px;text-align:center}
.mode{margin-left:auto;display:flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.mode button{border:0;background:none;color:var(--mut);font-size:13px;font-weight:600;padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.mode button.on{background:var(--acc);color:#14171a}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.res button{border:1px dashed var(--line);background:none;color:var(--tx);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.res button.new{border-color:var(--acc);color:var(--acc)}
.chip .x{margin-left:6px;opacity:.7}
.ing{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.ing:first-child{border-top:0}
.ing span{flex:1;min-width:0}
.ing input{width:84px;padding:7px;font-size:15px;flex:none}
.ing small{color:var(--mut);font-size:12px;flex:none}
.miss{font-size:13px;margin-top:4px}
.miss b{color:var(--ok)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:140px}
.form .row{margin-top:2px}
.famh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.famh:first-of-type{margin-top:4px}
</style>

/* ===== CALCOLI ===== */
function mealOk(m,pr){
 return m.it.every(([id])=>{const f=FOODS[id];
  if(f.fr&&!pr.frigo)return false;
  if(f.ht&&!pr.caldo)return false;
  if((f.tg||[]).some(t=>pr.escludi.includes(t)))return false;
  return true;});
}
function slotsFor(pr){return pr.pasti==4?["col","pra","spu","cen"]:["col","pra","cen"];}
function autoTargets(pr,rest){
 const bmr=10*pr.peso+6.25*pr.altezza-5*pr.eta+(pr.sesso==="m"?5:-161);
 return{k:bmr*(rest?pr.attR:pr.att)+({dim:-400,man:0,mas:250}[pr.obi]),p:pr.peso*(pr.obi==="dim"?1.8:1.6)};
}
// rest = giorno fermo: meno calorie, stesse proteine.
// Le kcal manuali valgono per i giorni di lavoro; nei giorni fermi si toglie la stessa differenza del calcolo automatico.
function targets(pr,rest){
 const w=autoTargets(pr,false),a=autoTargets(pr,!!rest);
 let k=a.k,p=a.p;
 if(pr.kcalMan>0)k=+pr.kcalMan-(w.k-a.k);
 if(pr.protMan>0)p=+pr.protMan;
 return{k:Math.round(k/10)*10,p:Math.round(p)};
}
// giorno fermo: segnato come riposo, oppure giorno a casa
const isRest=(pr,d,home)=>!!home||(pr.riposo||[]).includes(d);
const Td=(pr,d,home)=>targets(pr,isRest(pr,d,home));
function macros(id,g){const f=FOODS[id],x=g/100;return{k:f.k*x,p:f.p*x,c:f.c*x,f:f.f*x};}
function sum(list){const t={k:0,p:0,c:0,f:0};list.forEach(i=>{const m=macros(i.id,i.g);t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f;});return t;}
function step(id,g){const f=FOODS[id];if(f.u)return f.u;return g<=40?5:10;}
function rnd(id,g){const f=FOODS[id];if(f.u)return Math.max(1,Math.round(g/f.u))*f.u;const s=step(id,g);return Math.max(s,Math.round(g/s)*s);}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

// Calcola le grammature di un giorno per centrare kcal e proteine
function solveDay(mealIds,T){
 const items=[];
 mealIds.forEach((mid,mi)=>{const m=meal(mid);if(!m)return;
  m.it.forEach(([id,g,r])=>items.push({mi,id,base:g,g,r}));});
 const grp=r=>sum(items.filter(i=>i.r===r).map(i=>({id:i.id,g:i.base})));
 const P=grp("P"),C=grp("C"),F=grp("F");
 const r1=T.p-F.p,r2=T.k-F.k,det=P.p*C.k-P.k*C.p;
 let fp,fc;
 if(Math.abs(det)>1e-6){fp=(r1*C.k-C.p*r2)/det;fc=(P.p*r2-P.k*r1)/det;}
 if(!(fp>=.4&&fp<=3&&fc>=.4&&fc<=3)){
  fp=P.p>0?clamp((r1-C.p)/P.p,.4,3):1;
  fc=C.k>0?clamp((r2-fp*P.k)/C.k,.4,3):1;
 }
 items.forEach(i=>{if(i.r==="P")i.g=rnd(i.id,i.base*fp);else if(i.r==="C")i.g=rnd(i.id,i.base*fc);else i.g=rnd(i.id,i.base);});
 const lo=i=>Math.max(step(i.id,i.g),FOODS[i.id].u?FOODS[i.id].u:Math.round(i.base*.3)),hi=i=>i.base*2.8;
 const adj=items.filter(i=>i.r!=="F");
 for(let n=0;n<60;n++){
  const t=sum(items);
  if(t.p<T.p-.5){
   const c=adj.filter(i=>i.g+step(i.id,i.g)<=hi(i)).map(i=>{const m=macros(i.id,step(i.id,i.g));return{i,s:m.p/Math.max(m.k,1)};}).sort((a,b)=>b.s-a.s)[0];
   if(!c)break;c.i.g+=step(c.i.id,c.i.g);continue;
  }
  if(t.k>T.k*1.04){
   const c=adj.filter(i=>i.g-step(i.id,i.g)>=lo(i)).map(i=>{const m=macros(i.id,step(i.id,i.g));return{i,m};}).filter(o=>t.p-o.m.p>=T.p-.5).sort((a,b)=>(a.m.p/Math.max(a.m.k,1))-(b.m.p/Math.max(b.m.k,1)))[0];
   if(!c)break;c.i.g-=step(c.i.id,c.i.g);continue;
  }
  if(t.k<T.k*.96){
   const need=T.k-t.k;
   const c=adj.filter(i=>i.r==="C"&&i.g+step(i.id,i.g)<=hi(i)).map(i=>{const m=macros(i.id,step(i.id,i.g));return{i,d:Math.abs(m.k-need)};}).sort((a,b)=>a.d-b.d)[0];
   if(!c)break;c.i.g+=step(c.i.id,c.i.g);continue;
  }
  break;
 }
 const tot=sum(items);
 return{items,tot,pOk:tot.p>=T.p-.5,kOk:Math.abs(tot.k-T.k)<=T.k*.05};
}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};}
function pickMeal(slot,pr,avoid,r){
 let pool=MEALS.filter(m=>m.s.includes(slot)&&mealOk(m,pr));
 if(!pool.length)return null;
 const fresh=pool.filter(m=>!avoid.includes(m.id));
 if(fresh.length)pool=fresh;
 return pool[Math.floor(r()*pool.length)].id;
}
// Famiglia
const famOk=(r,pr)=>r.it.every(([id])=>!(FOODS[id].tg||[]).some(t=>pr.escludi.includes(t)));
const portable=(r,pr)=>!!r.porta&&pr.frigo&&(r.porta==="freddo"||pr.caldo);
const famCoef=pr=>pr.fam.ad+pr.fam.ra*.75+pr.fam.pi*.4;
const famN=pr=>pr.fam.ad+pr.fam.ra+pr.fam.pi;
// "@dom:cen" = il piatto di casa di domenica a cena
function resolveIds(ids,fam){return ids.map(x=>x&&x[0]==="@"?(fam&&fam[x.slice(1,4)]?fam[x.slice(1,4)][x.slice(5)]||null:null):x);}
function generatePlan(pr,seed,keepFam){
 const r=rng(seed),plan={},recent={},slots=slotsFor(pr),F=!!(pr.fam&&pr.fam.on),cab=pr.giorni;
 const days=F?DAYS.map(x=>x[0]):cab.slice(),home=d=>F&&!cab.includes(d);
 let fam=null;const refs={},cook={};
 if(F){
  // il giorno prima di ogni partenza si cucina in più per i primi pasti in cabina
  if(pr.fam.porta>0&&pr.frigo&&cab.length<7)cab.forEach(d=>{const i=DAYS.findIndex(x=>x[0]===d),prev=DAYS[(i+6)%7][0];
   if(cab.includes(prev))return;cook[prev]=1;const ref={pra:"@"+prev+":cen",cen:"@"+prev+":pra"};refs[d]=ref;
   if(pr.fam.porta>=4){const nx=DAYS[(i+1)%7][0];if(cab.includes(nx))refs[nx]=ref;}});
  fam={};const used=[];
  days.forEach(d=>{fam[d]={};["pra","cen"].forEach(w=>{
   const ex=keepFam&&keepFam[d]&&keepFam[d][w];
   if(ex&&meal(ex)&&famOk(meal(ex),pr)&&(!cook[d]||portable(meal(ex),pr))){fam[d][w]=ex;used.push(ex);return;}
   const base=REC.filter(x=>x.s.includes(w)&&famOk(x,pr));let pool=cook[d]?base.filter(x=>portable(x,pr)):base;if(!pool.length)pool=base;
   const fr=pool.filter(x=>!used.includes(x.id)),pk=fr.length?fr:pool,c=pk.length?pk[Math.floor(r()*pk.length)]:null;
   fam[d][w]=c?c.id:null;if(c)used.push(c.id);});});
 }
 days.forEach(d=>{
  const h=home(d),T=Td(pr,d,h),hp=h?Object.assign({},pr,{frigo:true,caldo:true}):pr;
  const fixed=h?{pra:"@"+d+":pra",cen:"@"+d+":cen"}:(refs[d]||{});
  let best=null;
  for(let a=0;a<25;a++){
   const used=[];
   const ids=slots.map(s=>{if(fixed[s])return fixed[s];const av=(a<15?(recent[s]||[]):[]).concat(used);const id=pickMeal(s,hp,av,r);if(id)used.push(id);return id;});
   const rids=resolveIds(ids,fam),res=solveDay(rids.filter(Boolean),T),sc=(rids.some(x=>!x)?5000:0)+(res.pOk?0:1000)+Math.abs(res.tot.k-T.k);
   if(!best||sc<best.sc)best={ids,sc};
   if(res.pOk&&res.kOk&&!rids.some(x=>!x))break;
  }
  plan[d]=best.ids;
  slots.forEach((s,i)=>{if(!fixed[s])recent[s]=((recent[s]||[]).concat(best.ids[i])).slice(-2);});
 });
 return{days:plan,fam,home:days.filter(home)};
}
function fmtQty(id,g){const f=FOODS[id];if(f.u){const n=Math.round(g/f.u);return n+" "+(n===1?f.ul[0]:f.ul[1])+(f.ul[0]==="scatoletta"?" ("+g+" g)":"");}return g+(f.ml?" ml":" g");}

function unitLbl(id){const f=FOODS[id];return f.pk[0]?"a "+f.pk[1]:f.u?"a "+f.ul[0]:(f.ml?"al litro":"al kg");}
function priceOf(id){const m=S.prezzi[id];if(m&&m.v>0)return m.v;return Math.round(FOODS[id].eur*(1+(+S.corr||0)/100)*100)/100;}
const eur=v=>"€ "+v.toFixed(2).replace(".",",");

// entries = [{id,g}] già filtrate: somma, arrotonda a pezzi/confezioni e calcola il costo
function shopping(entries){
 const tot={};entries.forEach(e=>{tot[e.id]=(tot[e.id]||0)+e.g;});
 return Object.entries(tot).map(([id,g])=>{const f=FOODS[id],pv=priceOf(id);let q,cost;
  if(f.u){const n=Math.max(1,Math.round(g/f.u));q=n+" "+(n===1?f.ul[0]:f.ul[1]);
   if(f.pk[0]){const k=Math.ceil(n/f.pk[0]);q+=" → "+k+"× "+f.pk[1];cost=k*pv;}else cost=n*pv;}
  else{q=fmtW(id,g)+pzHint(id,g);
   if(f.pk[0]){const k=Math.ceil(g/f.pk[0]);q+=" → "+k+"× "+f.pk[1];cost=k*pv;}else cost=g/1000*pv;}
  return{id,n:f.n,rep:f.rep,q,cost};}).sort((a,b)=>a.rep.localeCompare(b.rep)||a.n.localeCompare(b.n));
}
function fmtW(id,g){const f=FOODS[id],u=f.ml?["ml","l"]:["g","kg"];
 if(g>=1000)return(Math.round(g/100)/10).toString().replace(".",",")+" "+u[1];
 const st=g<100?5:10;return Math.max(st,Math.round(g/st)*st)+" "+u[0];}
// peso medio di un pezzo, per dire "≈ 6 cosce" accanto ai grammi
const PZ={cosce:[200,"coscia","cosce"],pollo_cr:[250,"petto","petti"],braciola:[200,"braciola","braciole"],salsiccia:[100,"salsiccia","salsicce"],
 patate:[200,"patata","patate"],patate_d:[300,"patata dolce","patate dolci"],zucchine:[200,"zucchina","zucchine"],melanzane:[300,"melanzana","melanzane"],
 peperoni:[200,"peperone","peperoni"],cipolla:[100,"cipolla","cipolle"],carote_n:[80,"carota","carote"],pomodori:[150,"pomodoro","pomodori"],
 finocchi:[250,"finocchio","finocchi"],carciofi:[150,"carciofo","carciofi"],cetrioli:[250,"cetriolo","cetrioli"],orata:[150,"filetto","filetti"],
 branzino:[150,"filetto","filetti"],merluzzo:[150,"filetto","filetti"],platessa:[120,"filetto","filetti"],salmone_f:[150,"trancio","tranci"],
 manzo:[100,"fettina","fettine"],vitello:[80,"fettina","fettine"],mozzarella:[125,"mozzarella","mozzarelle"],mozz_l:[125,"mozzarella","mozzarelle"],
 broccoli:[400,"broccolo","broccoli"],cavolfiore:[800,"cavolfiore","cavolfiori"],verza:[800,"verza","verze"],zucca:[1000,"zucca","zucche"]};
function pzHint(id,g){const z=PZ[id];if(!z||g<z[0]*.6)return"";const n=Math.max(1,Math.round(g/z[0]));return` (≈ ${n} ${n===1?z[1]:z[2]})`;}

/* ===== BACKUP ===== */
function backupText(){return JSON.stringify({app:"rifornimento",v:2,salvato:new Date().toISOString(),dati:S});}
function bindBackup(){
 const msg=t=>{$("#bk-msg").innerHTML=`<div class="status info">${esc(t)}</div>`;};
 $("#bk-dl").onclick=()=>{try{const b=new Blob([backupText()],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="rifornimento-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg("File salvato nei download. Se non lo trovi usa \"Copia testo\".");}catch(e){msg("Non riesco a salvare il file: usa \"Copia testo\".");}};
 $("#bk-cp").onclick=async()=>{try{await navigator.clipboard.writeText(backupText());msg("Backup copiato: incollalo in una nota o mandalo a te stesso su WhatsApp.");}
  catch(e){$("#bk-paste").hidden=false;$("#bk-ta").value=backupText();$("#bk-ta").select();$("#bk-go").hidden=true;msg("Copia a mano il testo qui sopra.");}};
 $("#bk-up").onclick=()=>$("#bk-file").click();
 $("#bk-file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result,msg);r.readAsText(f);};
 $("#bk-ps").onclick=()=>{$("#bk-paste").hidden=false;$("#bk-go").hidden=false;$("#bk-ta").value="";$("#bk-ta").focus();};
 $("#bk-go").onclick=()=>restore($("#bk-ta").value,msg);
}
function restore(txt,msg){
 let o;try{o=JSON.parse(String(txt).trim());}catch(e){msg("Questo non sembra un backup di Rifornimento.");return;}
 const d=o&&o.app==="rifornimento"?o.dati:o;
 if(!d||typeof d!=="object"||!d.profilo){msg("Questo non sembra un backup di Rifornimento.");return;}
 if(!confirm("Sostituire i dati attuali con quelli del backup?"))return;
 S=normalize(d);syncMine();S.view="profilo";save();render();
 setTimeout(()=>{const m=$("#bk-msg");if(m)m.innerHTML=`<div class="status ok">✓ Backup ripristinato.</div>`;},0);
}

// famiglie di ingredienti che si possono scambiare tra loro
const SUBS=[
 ["pollo_cr","cosce","tacch_cr","maci_bianco","coniglio","pollo_sc","seitan"],["manzo","vitello","macinato","agnello"],["lonza","braciola","salsiccia"],
 ["merluzzo","platessa","orata","branzino","baccala","alici"],["salmone_f","tonno_f","sgombro","tonno"],["gamberi","calamari","cozze"],
 ["ceci","fagioli","lentic","ceci_s","fagioli_s","lentic_s"],["mozz_l","mozzarella","ricotta","stracchino","feta","cottage","scamorza"],["grana","pecorino"],
 ["bresaola","cotto","crudo","speck","tacchino","pollo"],["pasta","pasta_int","noodles"],["riso","riso_pr","farro","orzo","quinoa","couscous"],
 ["pane","pane_int","piadina","wrap","bun"],["patate","patate_d"],["passata","pelati","pomodori","pomodorini"],
 ["zucchine","melanzane","peperoni","funghi","broccoli","cavolfiore","fagiolini","asparagi","carciofi","zucca","porri","verza","bietole","spinaci","finocchi"],
 ["insalata","rucola","radicchio","cetrioli"],["carote","carote_n","sedano"],["cipolla","porri"],["olio","burro"],["latte","soia","panna"],["piselli","mais","fagiolini"]];
const subFor=id=>{const g=SUBS.find(x=>x.includes(id));return g?g.find(x=>x!==id&&S.frigo.includes(x))||null:null;};
const ROLEW={P:3,C:2,F:1};
// quanto una ricetta si avvicina a ciò che hai: esatti, sostituibili, mancanti
function matchRec(R){
 let tot=0,got=0;const have=[],swaps=[],miss=[],seen=new Set();
 R.it.forEach(([id,,r])=>{if(STAPLE.includes(id)||seen.has(id))return;seen.add(id);const w=ROLEW[r]||1;tot+=w;
  if(hasIng(id)){got+=w;have.push(id);}else{const s=subFor(id);if(s){got+=w*.8;swaps.push([id,s]);}else miss.push(id);}});
 return{pct:tot?Math.round(got/tot*100):0,have,swaps,miss,proOk:R.it.some(([id,,r])=>r==="P"&&(hasIng(id)||subFor(id)))};
}
const NICK={pollo_cr:"pollo",cosce:"pollo",tacch_cr:"tacchino",macinato:"carne macinata",maci_bianco:"macinato bianco",salmone_f:"salmone",tonno_f:"tonno",tonno:"tonno",pollo_sc:"pollo",
 mozz_l:"mozzarella",lentic:"lenticchie",lentic_s:"lenticchie",ceci_s:"ceci",fagioli_s:"fagioli",carote:"carote",carote_n:"carote",riso_pr:"riso",farina_mais:"polenta",
 pasta_int:"pasta integrale",pane_int:"pane integrale",cottage:"fiocchi di latte",tacchino:"fesa di tacchino",pollo:"pollo",insalata:"insalata",bun:"panini",gnocchi:"gnocchi",
 ceci:"ceci",fagioli:"fagioli",mais:"mais",funghi:"funghi",spinaci:"spinaci",farro:"farro",orzo:"orzo",riso:"riso",pasta:"pasta",couscous:"cous cous",cipolla:"cipolla",
 passata:"passata",pelati:"pelati",sgombro:"sgombro",piselli:"piselli",merluzzo:"merluzzo",platessa:"platessa",orata:"orata",branzino:"branzino",gamberi:"gamberi",
 manzo:"manzo",vitello:"vitello",lonza:"lonza",braciola:"braciole",salsiccia:"salsiccia",scamorza:"scamorza",bietole:"bietole",noodles:"noodles",tortellini:"tortellini"};
const sn=id=>NICK[id]||FOODS[id].n.split(/[(/]/)[0].trim().toLowerCase();
const list=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
// la tua versione di una ricetta: sostituisce gli ingredienti e rifà i conti delle dosi
function adaptRec(R,swaps){
 const it=R.it.map(([id,g,r])=>{const sw=swaps.find(x=>x[0]===id);if(!sw)return[id,g,r];const to=sw[1],A=FOODS[id],B=FOODS[to];
  let ng=g;if(r==="P"&&B.p>0)ng=g*A.p/B.p;else if(r==="C"&&B.k>0)ng=g*A.k/B.k;
  ng=B.u?Math.max(1,Math.round(ng/B.u))*B.u:Math.max(5,Math.round(clamp(ng,g*.4,g*2.5)/5)*5);return[to,ng,autoRole(to)];});
 let st=(R.st||[]).map(x=>{let t=x;swaps.forEach(([a,b])=>{t=t.split(sn(a)).join(sn(b));});return t;});
 if(swaps.some(([,b])=>/_s$/.test(b)))st=["Metti in ammollo i legumi secchi la sera prima e lessali 40–60 minuti (oppure usa quelli in scatola)."].concat(st);
 let n=R.n,left=[];swaps.forEach(([a,b])=>{const re=new RegExp(sn(a).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");if(re.test(n))n=n.replace(re,sn(b));else left.push(sn(b));});
 if(left.length)n+=" (con "+list(left)+")";
 return{id:null,s:R.s.slice(),n,min:R.min,porta:R.porta,it,st,kid:R.kid||""};
}

// --- idee nuove: tipi di piatto veri in base a cosa hai ---
const G={
 rawMeat:id=>FOODS[id].rep==="Carne e pesce"&&(FOODS[id].tg||[]).includes("carne"),
 rawFish:id=>FOODS[id].rep==="Carne e pesce"&&(FOODS[id].tg||[]).includes("pesce"),
 canned:id=>["tonno","sgombro","pollo_sc"].includes(id),
 cured:id=>["bresaola","cotto","crudo","speck","tacchino","pollo","salmone","wurstel","jerky"].includes(id),
 egg:id=>id==="uova",legume:id=>["ceci","fagioli","lentic","ceci_s","fagioli_s","lentic_s"].includes(id),
 freshCheese:id=>["mozz_l","mozzarella","ricotta","stracchino","feta","cottage","scamorza"].includes(id),
 aged:id=>["grana","pecorino"].includes(id),vprot:id=>["tofu","seitan"].includes(id),
 pastaL:id=>["pasta","pasta_int","noodles","tortellini","gnocchi"].includes(id),grain:id=>["riso","riso_pr","farro","orzo","quinoa","couscous"].includes(id),
 bread:id=>["pane","pane_int","piadina","wrap","bun"].includes(id),potato:id=>["patate","patate_d"].includes(id),polenta:id=>id==="farina_mais",
 salad:id=>["insalata","rucola","radicchio","cetrioli","pomodorini","pomodori","carote","carote_n","finocchi","mais"].includes(id),
 sauce:id=>["passata","pelati"].includes(id)
};
const isCookVeg=id=>FOODS[id].rep==="Frutta e verdura"&&!["cipolla","limone"].includes(id)&&FOODS[id].k<=90&&!["banana","mela","arancia","pere","kiwi","fragole","uva","limone","avocado"].includes(id)&&!G.potato(id)&&!["insalata","rucola","radicchio","cetrioli"].includes(id);
function proG(id){const f=FOODS[id];const g=28/Math.max(f.p,1)*100;return f.u?f.u*Math.max(1,Math.round(g/f.u)):clamp(Math.round(g/10)*10,40,250);}
function carbG(id){const f=FOODS[id];if(f.u)return f.u*(id==="piadina"?1:id==="bun"?1:2);if(G.potato(id)||id==="gnocchi"||id==="riso_pr")return 250;if(id==="tortellini")return 125;if(G.polenta(id))return 70;if(G.bread(id))return 80;return 80;}
function cookStep(p){if(G.rawMeat(p))return`Cuoci ${sn(p)} a pezzi in padella con l'olio, 8–12 minuti, finché è ben cotto.`;
 if(G.rawFish(p))return`Cuoci ${sn(p)} in padella con l'olio, 3–5 minuti per lato (i molluschi 5–8 minuti).`;
 if(G.vprot(p))return`Taglia ${sn(p)} a cubetti e rosolalo in padella con l'olio 6–8 minuti.`;
 if(G.legume(p))return/_s$/.test(p)?`Metti in ammollo ${sn(p)} la sera prima e lessali 40–60 minuti.`:`Sciacqua e scola ${sn(p)}.`;
 if(G.canned(p))return`Sgocciola ${sn(p)}.`;return"";}
function makeIdeas(){
 const H=S.frigo.filter(id=>FOODS[id]),pick=f=>H.filter(f);
 const pros=pick(id=>G.rawMeat(id)||G.rawFish(id)||G.canned(id)||G.egg(id)||G.legume(id)||G.vprot(id)||G.cured(id)||G.freshCheese(id));
 const pastas=pick(G.pastaL),grains=pick(G.grain),breads=pick(G.bread),pots=pick(G.potato),pols=pick(G.polenta);
 const cveg=pick(isCookVeg),sveg=pick(G.salad),sauce=pick(G.sauce),aged=pick(G.aged),fcheese=pick(G.freshCheese);
 const tomato=sauce[0]||H.find(x=>x==="pomodorini"||x==="pomodori");
 const hasOnion=H.includes("cipolla");
 if(!pros.length&&!fcheese.length)return[];
 const out=[];let rot=0;
 const nxt=arr=>arr.length?arr[(rot++)%arr.length]:null;
 const vegs=(n,pool)=>{pool=pool||cveg;const r=[];for(let i=0;i<pool.length&&r.length<n;i++){const v=pool[(rot+i)%pool.length];if(!r.includes(v))r.push(v);}rot++;return r;};
 const add=(n,it,st,o)=>{if(out.some(x=>x.n===n))return;const seen=new Set();it=it.filter(([id])=>{if(seen.has(id))return false;seen.add(id);return true;});
  out.push(Object.assign({id:"idea"+out.length,n:cap(n),it,st:st.filter(Boolean),min:25,porta:"caldo",kid:"Porzione a pezzetti, sale solo dopo aver tolto la sua."},o||{}));};
 const P=(f)=>pros.filter(f);
 const vit=(vs,g)=>vs.map(v=>[v,g||(vs.length>1?100:150),"F"]);
 // 1 primo
 const pp=P(x=>!G.cured(x)&&!G.freshCheese(x)).concat(P(x=>G.cured(x)||G.freshCheese(x)));
 if(pastas.length&&pp.length){const c=nxt(pastas),p=nxt(pp),vs=vegs(2);
  add(`${sn(c)} ${tomato&&G.sauce(tomato)?"al sugo ":""}con ${list([sn(p)].concat(vs.map(sn)))}`,
   [[c,carbG(c),"C"],[p,proG(p),"P"]].concat(vit(vs)).concat(tomato?[[tomato,G.sauce(tomato)?100:120,"F"]]:[]).concat(aged.length?[[aged[0],10,"P"]]:[]).concat(hasOnion?[["cipolla",20,"F"]]:[]).concat([["olio",10,"C"]]),
   [`Metti a bollire l'acqua per ${sn(c)}.`,hasOnion?"Soffriggi la cipolla tritata nell'olio.":"Scalda l'olio in una padella larga.",cookStep(p),vs.length?`Aggiungi ${list(vs.map(sn))} a pezzetti e cuoci 8–10 minuti.`:"",tomato&&G.sauce(tomato)?`Versa ${sn(tomato)} e fai sobbollire 10 minuti.`:tomato?`Aggiungi ${sn(tomato)} tagliati negli ultimi 3 minuti.`:"",`Cuoci ${sn(c)}, scola e salta tutto in padella${aged.length?" con "+sn(aged[0]):""}.`],
   {porta:G.rawFish(p)?null:"caldo",min:30});}
 // 2 cereale: saltato o insalata fredda
 if(grains.length&&pp.length){const c=nxt(grains),p=nxt(pp),cold=G.canned(p)||G.egg(p)||G.freshCheese(p)||G.legume(p)||G.cured(p),vs=cold?vegs(2,sveg.length?sveg:cveg):vegs(2);
  const how=c==="couscous"?"Prepara il cous cous con acqua bollente salata (stesso peso), copri 5 minuti e sgrana.":c==="riso_pr"?"Scalda il riso pronto.":`Lessa ${sn(c)} in acqua salata${cold?", scolalo e raffreddalo sotto l'acqua":""}.`;
  add(cold?`Insalata fredda di ${sn(c)} con ${list([sn(p)].concat(vs.map(sn)))}`:`${sn(c)} saltato con ${list([sn(p)].concat(vs.map(sn)))}`,
   [[c,carbG(c),"C"],[p,proG(p),"P"]].concat(vit(vs)).concat([["olio",10,"C"]]),
   [how,G.egg(p)?(cold?"Rassoda le uova 9 minuti e tagliale a spicchi.":"Strapazza le uova in padella con un filo d'olio."):cookStep(p),vs.length?(cold?`Taglia ${list(vs.map(sn))} a cubetti.`:`Salta ${list(vs.map(sn))} in padella 8 minuti.`):"",cold?"Unisci tutto, condisci con olio, sale e limone se ce l'hai. Tienila in frigo.":"Aggiungi il cereale in padella, mescola 2 minuti e servi."],
   {porta:G.rawFish(p)?null:cold?"freddo":"caldo",min:cold?30:25});}
 // 3 secondo al forno con patate
 const ovenP=P(x=>G.rawMeat(x)||G.rawFish(x)||G.vprot(x));
 if(ovenP.length&&(pots.length||cveg.length)){const p=nxt(ovenP),c=pots[0]||null,vs=vegs(c?1:2);
  add(`${sn(p)} al forno con ${list((c?[sn(c)]:[]).concat(vs.map(sn)))}`,
   [[p,proG(p)+20,"P"]].concat(c?[[c,carbG(c),"C"]]:[]).concat(vit(vs)).concat([["olio",10,"C"]]).concat(!c&&breads.length?[[breads[0],carbG(breads[0]),"C"]]:[]),
   ["Accendi il forno a 200 °C.",`${c?"Taglia "+sn(c)+" a spicchi e ":""}${vs.length?(c?"aggiungi ":"metti in teglia ")+list(vs.map(sn))+" a pezzi; ":""}condisci con olio, sale e rosmarino e inforna per 20 minuti.`,

 // 4 in padella senza carboidrato (con pane se c'è)

 // 6 zuppa di legumi
 const leg=P(G.legume);
 if(leg.length){const p=nxt(leg),vs=vegs(2),c=pastas.find(x=>x!=="gnocchi"&&x!=="tortellini")||grains.find(x=>x!=="couscous"&&x!=="riso_pr")||null,br=!c&&breads.find(x=>x==="pane"||x==="pane_int");

 // 7 panino / piadina / wrap

 // 8 insalatona
 const coldP=P(x=>G.canned(x)||G.egg(x)||G.freshCheese(x)||G.legume(x)||G.cured(x));
 if(sveg.length&&coldP.length){const p=nxt(coldP),vs=vegs(3,sveg),ch=fcheese.find(x=>x!==p),br=breads.find(x=>x==="pane"||x==="pane_int")||null;
  add(`Insalatona con ${list([sn(p)].concat(ch?[sn(ch)]:[]).concat(vs.map(sn)))}`,
   [[p,proG(p),"P"]].concat(ch?[[ch,50,"P"]]:[]).concat(vit(vs,70)).concat(br?[[br,70,"C"]]:[]).concat([["olio",10,"C"]]),
   [G.egg(p)?"Rassoda le uova 9 minuti e tagliale a spicchi.":cookStep(p),`Lava e taglia ${list(vs.map(sn))}.`,"Unisci tutto in una ciotola, condisci con olio, sale e limone o aceto.",br?`Servi con ${sn(br)}.`:""],{porta:"freddo",min:15,kid:"Verdure tagliate piccole, niente pezzi duri."});}
 // 9 polpette
 const polP=P(x=>x==="macinato"||x==="maci_bianco"||G.legume(x));
 if(polP.length&&(breads.length||H.includes("pangrattato"))){const p=nxt(polP),bin=H.includes("pangrattato")?"pangrattato":breads[0],vs=vegs(1);
  add(`Polpette di ${sn(p)}${tomato&&G.sauce(tomato)?" al sugo":" al forno"}`,
   [[p,proG(p)+(G.legume(p)?60:0),"P"],[bin,G.legume(p)?30:25,"C"]].concat(aged.length?[[aged[0],10,"P"]]:[]).concat(tomato&&G.sauce(tomato)?[[tomato,130,"F"]]:vit(vs)).concat([["olio",8,"C"]]),
   [G.legume(p)?`Schiaccia o frulla ${sn(p)} scolati.`:"",`Impasta ${sn(p)} con ${bin==="pangrattato"?"il pangrattato":sn(bin)+" ammollato e strizzato"}${aged.length?", "+sn(aged[0]):""} e un pizzico di sale.`,"Forma polpette piccole.",tomato&&G.sauce(tomato)?`Cuocile 20 minuti in ${sn(tomato)} con l'olio.`:`Ungile d'olio e cuocile in forno a 200 °C per 20 minuti${vs.length?"; intanto cuoci "+sn(vs[0])+" in padella":""}.`],{porta:"caldo",min:40,kid:"Piccole e morbide: perfette per i bambini."});}
 // 10 polenta
 if(pols.length&&(pros.length||H.includes("funghi"))){const p=nxt(P(x=>G.rawMeat(x)||G.freshCheese(x)||G.legume(x)).concat(pros)),vs=vegs(1);
  add(`Polenta con ${list([sn(p)].concat(vs.map(sn)))}`,
   [["farina_mais",70,"C"],[p,proG(p),"P"]].concat(vit(vs)).concat(tomato&&G.sauce(tomato)?[[tomato,80,"F"]]:[]).concat([["olio",8,"C"]]),
   [cookStep(p),vs.length?`Aggiungi ${sn(vs[0])} e cuoci 10 minuti${tomato&&G.sauce(tomato)?" con "+sn(tomato):""}.`:"","Prepara la polenta istantanea come da confezione.",G.freshCheese(p)?`Servila calda con ${sn(p)} che si scioglie sopra.`:"Servi la polenta con il condimento sopra."],{porta:"caldo",min:30});}
 return out.slice(0,8).map((x,i)=>Object.assign(x,{id:"idea"+i}));
}

${fam}

function aiToRecipes(arr){
 if(!Array.isArray(arr))return[];
 const REPS=["Carne e pesce","Frigo","Frutta e verdura","Pane e cereali","Dispensa"],TGS=["carne","maiale","pesce","latticini","uova"],num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;};
 return arr.slice(0,3).map(r=>{
  const it=[];(Array.isArray(r.ingredienti)?r.ingredienti:[]).forEach(x=>{const g=Math.round(num(x.g));if(!(g>0&&g<2000))return;
   let id=x.id&&FOODS[x.id]?x.id:null;
   if(!id&&x.nome){id=matchFood(String(x.nome))||Object.keys(FOODS).find(k=>norm(FOODS[k].n)===norm(x.nome))||null;
    if(!id&&num(x.kcal)>=0&&x.kcal!=null){id="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
     S.myFoods[id]={n:String(x.nome).slice(0,60),k:num(x.kcal),p:num(x.prot),c:num(x.carb),f:num(x.grassi),rep:REPS.includes(x.reparto)?x.reparto:"Dispensa",pk:[0,""],eur:0,fr:x.reparto==="Frigo"||x.reparto==="Carne e pesce"?1:0,tg:(Array.isArray(x.tag)?x.tag:[]).filter(t=>TGS.includes(t))};
     FOODS[id]=S.myFoods[id];}}
   if(id&&!it.some(y=>y[0]===id))it.push([id,g,autoRole(id)]);});
  return{id:"ai",n:String(r.nome||"Ricetta di Claude").slice(0,80),min:Math.round(num(r.minuti))||30,porta:r.porta==="caldo"||r.porta==="freddo"?r.porta:null,
   it,st:(Array.isArray(r.passaggi)?r.passaggi:[]).map(x=>String(x).slice(0,300)).slice(0,10),kid:String(r.bambini||"").slice(0,200),ai:true};
 }).filter(r=>r.it.length>=2);
}

// Lettura del testo sul telefono con Tesseract (libreria gratuita): la foto non va su nessun server.
const OCR_CFG=Object.assign({lib:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",worker:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
 core:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",lang:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/ita@1.0.0/4.0.0"},window.OCR_CFG||{});
let OC=null,ocrWorker=null;
function loadScript(src){return new Promise((ok,ko)=>{if(window.Tesseract)return ok();const sc=document.createElement("script");sc.src=src;sc.onload=ok;sc.onerror=()=>ko(new Error("load"));document.head.appendChild(sc);});}
function prepImage(file){return new Promise((ok,ko)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const sc=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),a=d.data;let lo=255,hi=0;
  for(let i=0;i<a.length;i+=4){const g=.299*a[i]+.587*a[i+1]+.114*a[i+2];a[i]=g;if(g<lo)lo=g;if(g>hi)hi=g;}
  const r=Math.max(1,hi-lo);for(let i=0;i<a.length;i+=4){const g=Math.max(0,Math.min(255,(a[i]-lo)*255/r));a[i]=a[i+1]=a[i+2]=g;}
  x.putImageData(d,0,0);const t=document.createElement("canvas"),ts=Math.min(1,320/Math.max(c.width,c.height));t.width=c.width*ts;t.height=c.height*ts;t.getContext("2d").drawImage(im,0,0,t.width,t.height);
  URL.revokeObjectURL(url);ok({canvas:c,thumb:t.toDataURL("image/jpeg",.7)});};
 im.onerror=()=>ko(new Error("img"));im.src=url;});}
const PRICE_RE=/(\d{1,3})\s?[,.]\s?(\d{2})(?!\d)/g;
const SKIP_RE=/\btotale|\bsubtotale|\biva\b|\bcontant|\bresto\b|\bpagamento|\bbancomat|\bcarta\b|\bscontrino|\bdocumento|\bcassa\b|\boperatore|\bimporto|\bsconto|\brisparmi|\bpunti\b|\bfidelity|\bp\.?\s?iva|\btel\b|\bvia\b|\bn\.\s?\d/i;
const UNIT_RE=/kg|\/\s?l\b|litr|\blt\b|al\s?kg|€\s?\/|\/\s?kg|al\s?pz|al\s?litro|\/\s?100/i;
const nice=t=>{t=t.replace(/[^A-Za-zÀ-ÿ0-9%'.,\- ]/g," ").replace(/\s+/g," ").trim().toLowerCase();return t.charAt(0).toUpperCase()+t.slice(1);};
// dal testo letto: un cartellino (nome + prezzo grande) o uno scontrino (più righe nome + prezzo)
function parseOCR(data){
 const lines=(data.lines&&data.lines.length?data.lines:(data.text||"").split("\n").map(t=>({text:t,bbox:{y0:0,y1:0}}))).map(l=>({t:(l.text||"").replace(/\s+/g," ").trim(),h:l.bbox?l.bbox.y1-l.bbox.y0:0})).filter(l=>l.t);
 const prices=[],pairs=[],names=[];
 lines.forEach((l,i)=>{const ms=[...l.t.matchAll(PRICE_RE)].map(m=>+(m[1]+"."+m[2]));const letters=(l.t.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
  const unit=UNIT_RE.test(l.t),skip=SKIP_RE.test(l.t);
  // il prezzo al kg/litro è quello vicino a "kg", "/l", "€/"; gli altri sulla stessa riga restano prezzi veri
  let prevEnd=0;
  [...l.t.matchAll(PRICE_RE)].forEach(m=>{const v=+(m[1]+"."+m[2]);const before=l.t.slice(prevEnd,m.index);prevEnd=m.index+m[0].length;if(!(v>0&&v<500))return;
   const ctx=before+" "+l.t.slice(prevEnd,prevEnd+6).split(/\d/)[0];
   prices.push({v,h:l.h,unit:UNIT_RE.test(ctx),skip,i});});
  if(ms.length&&!unit&&!skip&&letters>=4){const nm=nice(l.t.replace(PRICE_RE," ").replace(/€|eur\b/ig," ").replace(/\b\d+\s?[x×]\s?\d+\w*\b/ig,m=>m));if(nm.replace(/[^a-zà-ÿ]/gi,"").length>=3)pairs.push({n:nm,p:ms[ms.length-1]});}
  if(!ms.length&&!skip&&letters>=4&&letters/l.t.length>=.55&&!/prezzo|offerta|promo|al kg|euro/i.test(l.t))names.push({t:l.t,i,h:l.h});});
 let unitPrice=(prices.find(x=>x.unit)||{}).v||null;
 if(pairs.length>=3)return{mode:"scontrino",items:pairs.slice(0,30).map(x=>({n:x.n,p:x.p,on:true})),unitPrice:null};
 const main=prices.filter(x=>!x.unit&&!x.skip).sort((a,b)=>b.h-a.h)[0]||prices.filter(x=>!x.unit)[0]||null;
 const nm=names.slice(0,2).map(x=>x.t).join(" ");
 return{mode:"etichetta",items:[{n:nice(nm)||"",p:main?main.v:null,on:true}],unitPrice};
}
// abbinamento prudente: servono abbastanza parole in comune, così "caffè macinato" non diventa carne macinata
function matchFood(n){const w=norm(n).split(/[^a-z]+/).filter(x=>x.length>=4);if(!w.length)return null;let best=null,bs=0;
 const same=(a,b)=>a===b||(a.length>=5&&b.length>=5&&a.slice(0,5)===b.slice(0,5));
 Object.keys(FOODS).forEach(id=>{const fw=norm(FOODS[id].n).split(/[^a-z]+/).filter(x=>x.length>=4);if(!fw.length||!same(fw[0],w[0]))return;
  // se l'ingrediente è "in scatola", "pronto", "cotto"… anche l'etichetta deve dirlo
  if(fw.some(x=>/^(scatola|pronto|pronta|cotto|affumicato|secchi|tostati|essicc|fresc)/.test(x)&&!w.some(y=>same(x,y))))return;
  const di=norm(FOODS[id].n).match(/\bdi\s+([a-z]{4,})/);if(di&&!w.some(y=>same(di[1],y)))return;
  const sc=fw.filter(x=>w.some(y=>same(x,y))).length/fw.length;if(sc>bs){bs=sc;best=id;}});return best;}
async function runOCR(file){
 OC={busy:true,msg:"Preparo la foto…",items:[]};vSpesa();
 try{const {canvas,thumb}=await prepImage(file);OC.thumb=thumb;OC.msg="Scarico il lettore di testo (solo la prima volta, serve internet)…";vSpesa();
  await loadScript(OCR_CFG.lib);
  if(!ocrWorker)ocrWorker=await Tesseract.createWorker("ita",1,{workerPath:OCR_CFG.worker,corePath:OCR_CFG.core,langPath:OCR_CFG.lang,
   logger:m=>{if(m.status==="recognizing text"&&OC&&OC.busy){OC.msg="Leggo l'etichetta… "+Math.round((m.progress||0)*100)+"%";const e=$("#ocr-msg");if(e)e.textContent=OC.msg;}}});
  OC.msg="Leggo l'etichetta…";vSpesa();
  const {data}=await ocrWorker.recognize(canvas);
  const r=parseOCR(data);OC=Object.assign({busy:false,thumb,raw:data.text||""},r);
  OC.items.forEach(it=>{it.f=matchFood(it.n);});
  if(!OC.items.some(x=>x.n||x.p))OC.err="Non sono riuscito a leggere bene: prova una foto più vicina, dritta e con buona luce. Puoi anche scrivere qui sotto.";
 }catch(e){OC={busy:false,err:e&&e.message==="load"?"Per leggere le foto la prima volta serve internet: riprova quando hai campo.":"Qualcosa è andato storto con la foto: riprova.",items:[{n:"",p:null,on:true}],thumb:OC&&OC.thumb};}
 vSpesa();
}
function ocrBox(){
 if(!OC)return"";
 if(OC.busy)return`<div class="status info" style="display:flex;gap:10px;align-items:center">${OC.thumb?`<img src="${OC.thumb}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:8px">`:""}<span id="ocr-msg">${esc(OC.msg)}</span></div>`;
 const one=OC.items.length===1;
 return`<div class="status info"><div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">${OC.thumb?`<img src="${OC.thumb}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:8px">`:""}
  <b>${OC.err?"⚠ "+esc(OC.err):OC.mode==="scontrino"?`📄 Scontrino: ${OC.items.length} prodotti trovati`:"🏷 Ho letto questo, controlla:"}</b></div>
  ${OC.items.map((it,i)=>`<div class="ing">${one?"":`<input type="checkbox" data-oon="${i}" ${it.on?"checked":""} style="width:20px;height:20px">`}<input data-on="${i}" value="${esc(it.n)}" placeholder="Nome prodotto" style="flex:1;width:auto"><input data-op="${i}" inputmode="decimal" value="${it.p!=null?it.p.toFixed(2).replace(".",","):""}" placeholder="€" style="width:76px"></div>
   ${it.f?`<label style="display:flex;gap:8px;align-items:center;margin:2px 0 4px"><input type="checkbox" data-ofood="${i}" ${it.fu!==false?"checked":""} style="width:18px;height:18px"> Aggiorna il prezzo di «${esc(FOODS[it.f].n)}» (${esc(unitLbl(it.f))})</label>`:""}`).join("")}
  ${OC.unitPrice?`<div class="mm">Prezzo al kg/litro letto: ${eur(OC.unitPrice)}</div>`:""}
  ${OC.raw?`<details><summary>Testo letto</summary><div class="mm" style="white-space:pre-wrap">${esc(OC.raw.trim())}</div></details>`:""}
  <div class="btnrow"><button class="btn sm" id="ocr-ok">✓ Aggiungi${one?"":" i selezionati"}</button><button class="btn ghost sm" id="ocr-no">Annulla</button></div></div>`;
}
function bindOCR(){
 const fb=$("#ocr-btn"),fi=$("#ocr-file");if(fb)fb.onclick=()=>fi.click();
 if(fi)fi.onchange=e=>{const f=e.target.files[0];if(f)runOCR(f);};
 if(!OC||OC.busy)return;
 document.querySelectorAll("[data-on]").forEach(i=>i.oninput=()=>{const it=OC.items[+i.dataset.on];it.n=i.value;});
 document.querySelectorAll("[data-op]").forEach(i=>i.oninput=()=>{const v=parseFloat(i.value.replace(",","."));OC.items[+i.dataset.op].p=v>0?v:null;});

 document.querySelectorAll("[data-ofood]").forEach(c=>c.onchange=()=>{OC.items[+c.dataset.ofood].fu=c.checked;});
 const no=$("#ocr-no");if(no)no.onclick=()=>{OC=null;vSpesa();};
 const ok=$("#ocr-ok");if(ok)ok.onclick=()=>{const today=new Date().toISOString().slice(0,10);
  OC.items.filter(it=>it.on&&it.n.trim()).forEach(it=>{const n=it.n.trim(),p=it.p||0;
   const same=S.extra.find(x=>!x.ok&&!x.q&&norm(x.n)===norm(n));if(same){same.qty=(same.qty||1)+1;if(p)same.p=p;}else S.extra.push({n,qty:1,p,unit:""});
   S.recentEx=[{n,p}].concat(S.recentEx.filter(x=>norm(x.n)!==norm(n))).slice(0,20);

  OC=null;save();vSpesa();};
}

function weekEntries(){
 const p=S.profilo,PD=S.plan.days,fam=S.plan.fam,get=solver(),out=[];
 Object.keys(PD).forEach(d=>{const ds=get(d),h=planHome(d);
  ds.slotItems.forEach((its,mi)=>{const id=ds.ids[mi],ref=!!id&&id[0]==="@",place=ref||h?"casa":"cab",day=ref?id.slice(1,4):d;
   its.forEach(i=>out.push({id:i.id,g:i.g,place,day}));});
  if(fam&&fam[d]){const co=famCoef(p);["pra","cen"].forEach(w=>{const R=meal(fam[d][w]);if(R)R.it.forEach(([id,g])=>out.push({id,g:g*co,place:"casa",day:d}));});}
 });

function spesaLists(){

 const span=ds=>dayLbl(ds[0])+(ds.length>1?"–"+dayLbl(ds[ds.length-1]):"");

 groups.forEach(([pl,title])=>{const E=all.filter(e=>e.place===pl);if(!E.length)return;
  const ds=order.filter(d=>E.some(e=>e.day===d));
  const name=title||"Spesa per "+ds.length+(ds.length===1?" giorno":" giorni");
  if(S.split&&ds.length>=4){const h=Math.ceil(ds.length/2),a=ds.slice(0,h),b=ds.slice(h);
   lists.push({k:pl+"1",t:name+" · 1",sub:"Dispensa per "+span(ds)+" + fresco per "+span(a),items:shopping(E.filter(e=>!isFresh(e.id)||a.includes(e.day)))});

  }else lists.push({k:pl,t:name,sub:fam?"Per "+span(ds):"",items:shopping(E)});

  <div class="mm">• Per gli aumenti generali usa il <b>ritocco</b> qui sotto: +5% alza tutti i prezzi che non hai cambiato tu.</div>
  <div class="mm">• Olio, pane, miele e grana sono contati solo per la parte che usi.</div>
  <div class="row" style="align-items:end"><div><label>Ritocco prezzi base (%)</label><input id="corr" type="number" inputmode="numeric" value="${+S.corr||0}"></div>
  <button class="btn ghost sm" id="rstp" ${mine?"":"disabled"}>Cancella i miei ${mine||""} prezzi</button></div>
 </div>
 <p class="note">Le confezioni sono indicative. Fresco (yogurt, affettati, insalata) per più di 3–4 giorni: meglio fare due spese o usare la borsa frigo ben carica.</p>`;
 $("#app").innerHTML=html;
 bindStale(vSpesa);
 // un prodotto dell'elenco ingredienti propone il suo prezzo
 const foodByName=n=>Object.keys(FOODS).find(id=>norm(FOODS[id].n)===norm(n));
 const exHint=()=>{const n=$("#ex-n").value.trim(),id=foodByName(n),r=S.recentEx.find(x=>norm(x.n)===norm(n));
  const sug=r&&r.p?r.p:id?priceOf(id):null;$("#ex-p").placeholder=sug?sug.toFixed(2).replace(".",","):"—";
  $("#ex-pl").textContent=id?"Prezzo "+unitLbl(id).replace(/^a /,"a ").replace(/^al /,"al ")+" (€)":"Prezzo € (se vuoi)";
  const q=norm(n),words=q.split(/\s+/).filter(Boolean);
  const pool=[...new Set(S.recentEx.map(x=>x.n).concat(Object.keys(FOODS).map(k=>FOODS[k].n)))];
  const hits=words.length?pool.filter(x=>{const t=norm(x);return words.every(w=>t.includes(w))&&t!==q;}).slice(0,8):[];
  const out=$("#ex-sug");out.innerHTML=hits.map(h=>`<button data-sug="${esc(h)}">${esc(h)}</button>`).join("");
  out.querySelectorAll("[data-sug]").forEach(bt=>bt.onclick=()=>{$("#ex-n").value=bt.dataset.sug;exHint();$("#ex-q").focus();});};
 const addEx=(n,qty,pr)=>{const id=foodByName(n),r=S.recentEx.find(x=>norm(x.n)===norm(n));
  const pv=pr>0?pr:(r&&r.p)||(id?priceOf(id):0);
  const same=S.extra.find(x=>!x.ok&&!x.q&&norm(x.n)===norm(n));
  if(same){same.qty=(same.qty||1)+qty;if(pv)same.p=pv;}else S.extra.push({n,qty,p:pv||0,unit:id?unitLbl(id):""});
  S.recentEx=[{n,p:pv||0}].concat(S.recentEx.filter(x=>norm(x.n)!==norm(n))).slice(0,20);save();vSpesa();};
 const exAdd=()=>{const n=$("#ex-n").value.trim();if(!n)return;const num=v=>parseFloat(String(v).replace(",","."));
  addEx(n,num($("#ex-q").value)>0?num($("#ex-q").value):1,num($("#ex-p").value));setTimeout(()=>{const i=$("#ex-n");if(i)i.focus();},0);};
 bindOCR();
 $("#ex-add").onclick=exAdd;$("#ex-n").oninput=exHint;$("#ex-n").onkeydown=e=>{if(e.key==="Enter")$("#ex-q").focus();};
 $("#ex-p").onkeydown=$("#ex-q").onkeydown=e=>{if(e.key==="Enter")exAdd();};
 document.querySelectorAll("[data-rec]").forEach(c=>c.onclick=()=>{const r=recent[+c.dataset.rec];addEx(r.n,1,r.p);});
 document.querySelectorAll("[data-exp]").forEach(bt=>bt.onclick=()=>{const x=S.extra[+bt.dataset.exp];
  const v=prompt(`Prezzo di ${x.n}${x.unit?" ("+x.unit+")":" (a pezzo)"}, in euro:`,x.p?x.p.toFixed(2).replace(".",","):"");if(v===null)return;
  const n=parseFloat(v.trim().replace(",","."));x.p=n>0?Math.round(n*100)/100:0;
  const r=S.recentEx.find(y=>norm(y.n)===norm(x.n));if(r)r.p=x.p;else S.recentEx.unshift({n:x.n,p:x.p});save();vSpesa();});
 document.querySelectorAll("[data-exc]").forEach(c=>c.onchange=()=>{S.extra[+c.dataset.exc].ok=c.checked;save();vSpesa();});
 document.querySelectorAll("[data-exd]").forEach(b=>b.onclick=()=>{S.extra.splice(+b.dataset.exd,1);save();vSpesa();});
 document.querySelectorAll("[data-sp]").forEach(c=>c.onclick=()=>{S.split=c.dataset.sp==="1";save();vSpesa();});
 document.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{S.check[c.dataset.c]=c.checked;save();vSpesa();});
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const id=b.dataset.p,f=FOODS[id];
  const v=prompt(`Prezzo di ${f.n} (${unitLbl(id)}), in euro.\nLascia vuoto per tornare al prezzo base.`,priceOf(id).toFixed(2).replace(".",","));
  if(v===null)return;const t=v.trim().replace(",",".");
  if(t===""){delete S.prezzi[id];}else{const n=parseFloat(t);if(!(n>0)){alert("Prezzo non valido");return;}S.prezzi[id]={v:Math.round(n*100)/100,d:new Date().toISOString().slice(0,10)};}
  save();vSpesa();});
 $("#corr").onchange=e=>{S.corr=clamp(+e.target.value||0,-50,200);save();vSpesa();};
 $("#rstp").onclick=()=>{if(confirm("Tornare ai prezzi base per tutti gli alimenti?")){S.prezzi={};save();vSpesa();}};
 $("#clr").onclick=()=>{S.check={};save();vSpesa();};
 $("#share").onclick=async()=>{let t="🛒 Spesa Rifornimento\n";
  const ex=S.extra.filter(x=>!x.ok);if(ex.length){t+="\n*Aggiunte*\n";ex.forEach(x=>{t+="• "+x.n+": "+(x.q||(x.qty||1))+"\n";});}
  lists.forEach(L=>{const left=L.items.filter(x=>!S.check[L.k+":"+x.id]);if(!left.length)return;
   if(lists.length>1)t+="\n— "+L.t+" —\n";let r="";
   left.forEach(x=>{if(x.rep!==r){r=x.rep;t+="\n*"+r+"*\n";}t+="• "+x.n+": "+x.q+"\n";});
   t+="\nStima: ≈ "+eur(left.reduce((a,x)=>a+x.cost,0))+"\n";});
  const b=$("#share");
  try{if(navigator.share){await navigator.share({text:t});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  try{await navigator.clipboard.writeText(t);b.textContent="✓ Lista copiata: incollala su WhatsApp";}
  catch(e){const ta=$("#sharetxt");ta.hidden=false;ta.value=t;ta.select();b.textContent="Copia il testo qui sotto";}};
}

$("#ver").textContent="v"+document.querySelector('meta[name="app-version"]').content.split(" ·")[0];
render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.hostname)){try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
</script>
