<style>
:root{--bg:#14171a;--card:#1d2226;--card2:#252b30;--line:#323a40;--tx:#e8eaed;--mut:#9aa3ab;--acc:#f5a524;--ok:#3ecf8e;--ko:#ff6b5b;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:16px 16px 8px;display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
header svg{width:34px;height:34px;flex:none}
header h1{font-size:19px;letter-spacing:.2px}
header small{display:block;color:var(--mut);font-size:12px;font-weight:400}
main{padding:0 12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0}
h2{font-size:16px;margin-bottom:8px}
h3{font-size:14px;color:var(--mut);font-weight:600;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
textarea{height:120px;font-size:13px;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:#14171a;border-color:var(--acc);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;background:var(--acc);color:#14171a;cursor:pointer;margin-top:14px}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:10px;font-size:14px;margin-top:10px}
.mini{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer;white-space:nowrap}
.mini.on{border-color:var(--ok);color:var(--ok)}
.btns{display:flex;gap:6px;flex:none}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.big{font-size:26px;font-weight:800}
.big span{font-size:13px;color:var(--mut);font-weight:500}
.sub{font-size:13px;color:var(--mut);margin-top:6px}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.daytabs .chip{flex:none;position:relative}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar i.ok{background:var(--ok)}
.meter{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.meter b{color:var(--tx)}
.status{border-radius:10px;padding:9px 11px;font-size:14px;margin-top:10px}
.status.ok{background:rgba(62,207,142,.12);color:var(--ok)}
.status.ko{background:rgba(255,107,91,.12);color:var(--ko)}
.status.warn{background:rgba(245,165,36,.12);color:var(--acc)}
.status.info{background:var(--card2);color:var(--tx)}
.meal{border-top:1px solid var(--line);padding:12px 0 4px}
.meal:first-of-type{border-top:0}
.meal.eaten .nm,.meal.eaten .food{opacity:.55}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mh .slot{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.mh .nm{font-weight:650}
.food{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0;color:#cfd4d8}
.food em{font-style:normal;color:var(--tx);font-variant-numeric:tabular-nums;white-space:nowrap}
.mm{font-size:12px;color:var(--mut);margin-top:4px}
.tags{font-size:12px;color:var(--mut);margin-top:3px}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li input{width:20px;height:20px;flex:none;accent-color:var(--acc)}
.li label{margin:0;font-size:14px;color:var(--tx);flex:1;min-width:0;cursor:pointer}
.li label small{display:block;color:var(--mut);font-size:12px}
.li.done label{text-decoration:line-through;color:var(--mut)}
.pr{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:8px;padding:5px 8px;font-size:13px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.pr.mine{border-color:var(--acc);color:var(--acc)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tot b{font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0f1214;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--acc)}
.note{font-size:12px;color:var(--mut);margin:14px 4px 20px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
</style>

/* ===== CALCOLI ===== */
function mealOk(m,pr){
 return m.it.every(([id])=>{const f=FOODS[id];
  if(f.fr&&!pr.frigo)return false;
  if(f.ht&&!pr.caldo)return false;
  if((f.tg||[]).some(t=>pr.escludi.includes(t)))return false;

function slotsFor(pr){return pr.pasti==4?["col","pra","spu","cen"]:["col","pra","cen"];}
function autoTargets(pr,rest){
 const bmr=10*pr.peso+6.25*pr.altezza-5*pr.eta+(pr.sesso==="m"?5:-161);
 return{k:bmr*(rest?pr.attR:pr.att)+({dim:-400,man:0,mas:250}[pr.obi]),p:pr.peso*(pr.obi==="dim"?1.8:1.6)};
}
// rest = giorno fermo: meno calorie, stesse proteine.
// Le kcal manuali valgono per i giorni di lavoro; nei giorni fermi si toglie la stessa differenza del calcolo automatico.
function targets(pr,rest){
 const w=autoTargets(pr,false),a=autoTargets(pr,!!rest);
 let k=a.k,p=a.p;
 if(pr.kcalMan>0)k=+pr.kcalMan-(w.k-a.k);
 if(pr.protMan>0)p=+pr.protMan;
 return{k:Math.round(k/10)*10,p:Math.round(p)};
}
const isRest=(pr,d)=>(pr.riposo||[]).includes(d);
const Td=(pr,d)=>targets(pr,isRest(pr,d));
function macros(id,g){const f=FOODS[id],x=g/100;return{k:f.k*x,p:f.p*x,c:f.c*x,f:f.f*x};}
function sum(list){const t={k:0,p:0,c:0,f:0};list.forEach(i=>{const m=macros(i.id,i.g);t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f;});return t;}
function step(id,g){const f=FOODS[id];if(f.u)return f.u;return g<=40?5:10;}
function rnd(id,g){const f=FOODS[id];if(f.u)return Math.max(1,Math.round(g/f.u))*f.u;const s=step(id,g);return Math.max(s,Math.round(g/s)*s);}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

// Calcola le grammature di un giorno per centrare kcal e proteine
function solveDay(mealIds,T){
 const items=[];
 mealIds.forEach((mid,mi)=>{const m=MEALS.find(x=>x.id===mid);if(!m)return;
  m.it.forEach(([id,g,r])=>items.push({mi,id,base:g,g,r}));});
 const grp=r=>sum(items.filter(i=>i.r===r).map(i=>({id:i.id,g:i.base})));
 const P=grp("P"),C=grp("C"),F=grp("F");
 const r1=T.p-F.p,r2=T.k-F.k,det=P.p*C.k-P.k*C.p;
 let fp,fc;
 if(Math.abs(det)>1e-6){fp=(r1*C.k-C.p*r2)/det;fc=(P.p*r2-P.k*r1)/det;}
 if(!(fp>=.4&&fp<=3&&fc>=.4&&fc<=3)){
  fp=P.p>0?clamp((r1-C.p)/P.p,.4,3):1;
  fc=C.k>0?clamp((r2-fp*P.k)/C.k,.4,3):1;
 }
 items.forEach(i=>{if(i.r==="P")i.g=rnd(i.id,i.base*fp);else if(i.r==="C")i.g=rnd(i.id,i.base*fc);else i.g=rnd(i.id,i.base);});
 const lo=i=>Math.max(step(i.id,i.g),FOODS[i.id].u?FOODS[i.id].u:Math.round(i.base*.3)),hi=i=>i.base*2.8;
 const adj=items.filter(i=>i.r!=="F");
 for(let n=0;n<60;n++){
  const t=sum(items);
  if(t.p<T.p-.5){
   const c=adj.filter(i=>i.g+step(i.id,i.g)<=hi(i)).map(i=>{const m=macros(i.id,step(i.id,i.g));return{i,s:m.p/Math.max(m.k,1)};}).sort((a,b)=>b.s-a.s)[0];
   if(!c)break;c.i.g+=step(c.i.id,c.i.g);continue;
  }
  if(t.k>T.k*1.04){
   const c=adj.filter(i=>i.g-step(i.id,i.g)>=lo(i)).map(i=>{const m=macros(i.id,step(i.id,i.g));return{i,m};}).filter(o=>t.p-o.m.p>=T.p-.5).sort((a,b)=>(a.m.p/Math.max(a.m.k,1))-(b.m.p/Math.max(b.m.k,1)))[0];
   if(!c)break;c.i.g-=step(c.i.id,c.i.g);continue;
  }
  if(t.k<T.k*.96){
   const need=T.k-t.k;
   const c=adj.filter(i=>i.r==="C"&&i.g+step(i.id,i.g)<=hi(i)).map(i=>{const m=macros(i.id,step(i.id,i.g));return{i,d:Math.abs(m.k-need)};}).sort((a,b)=>a.d-b.d)[0];
   if(!c)break;c.i.g+=step(c.i.id,c.i.g);continue;
  }
  break;
 }
 const tot=sum(items);
 return{items,tot,pOk:tot.p>=T.p-.5,kOk:Math.abs(tot.k-T.k)<=T.k*.05};
}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};}
function pickMeal(slot,pr,avoid,r){
 let pool=MEALS.filter(m=>m.s.includes(slot)&&mealOk(m,pr));
 if(!pool.length)return null;
 const fresh=pool.filter(m=>!avoid.includes(m.id));
 if(fresh.length)pool=fresh;
 return pool[Math.floor(r()*pool.length)].id;
}
function generatePlan(pr,seed){
 const r=rng(seed),plan={},recent={},slots=slotsFor(pr);
 pr.giorni.forEach(d=>{
  const T=Td(pr,d);let best=null;
  for(let a=0;a<25;a++){
   const used=[];
   const ids=slots.map(s=>{const av=(a<15?(recent[s]||[]):[]).concat(used);const id=pickMeal(s,pr,av,r);if(id)used.push(id);return id;});
   const res=solveDay(ids.filter(Boolean),T),sc=(ids.some(x=>!x)?5000:0)+(res.pOk?0:1000)+Math.abs(res.tot.k-T.k);
   if(!best||sc<best.sc)best={ids,sc};
   if(res.pOk&&res.kOk&&!ids.some(x=>!x))break;
  }
  plan[d]=best.ids;
  slots.forEach((s,i)=>{recent[s]=((recent[s]||[]).concat(best.ids[i])).slice(-2);});
 });
 return plan;
}
function fmtQty(id,g){const f=FOODS[id];if(f.u){const n=Math.round(g/f.u);return n+" "+(n===1?f.ul[0]:f.ul[1])+(f.ul[0]==="scatoletta"?" ("+g+" g)":"");}return g+(f.ml?" ml":" g");}
const isFresh=id=>!!FOODS[id].fr||FOODS[id].rep==="Frutta e verdura";

/* ===== PREZZI ===== */
// Prezzo base indicativo, ritoccato della percentuale scelta; se l'hai inserito tu vince il tuo.
function unitLbl(id){const f=FOODS[id];return f.pk[0]?"a "+f.pk[1]:f.u?"a "+f.ul[0]:(f.ml?"al litro":"al kg");}
function priceOf(id){const m=S.prezzi[id];if(m&&m.v>0)return m.v;return Math.round(FOODS[id].eur*(1+(+S.corr||0)/100)*100)/100;}
const eur=v=>"€ "+v.toFixed(2).replace(".",",");

// days = giorni da includere, inc(d,id) = se quell'alimento di quel giorno va in questa lista
function shopping(planDays,days,pr,inc){
 const tot={};
 days.forEach(d=>{const s=solveDay(planDays[d].filter(Boolean),Td(pr,d));s.items.forEach(i=>{if(inc(d,i.id))tot[i.id]=(tot[i.id]||0)+i.g;});});
 return Object.entries(tot).map(([id,g])=>{const f=FOODS[id],pv=priceOf(id);let q,cost;
  if(f.u){const n=Math.round(g/f.u);q=n+" "+(n===1?f.ul[0]:f.ul[1]);
   if(f.pk[0]){const k=Math.ceil(n/f.pk[0]);q+=" → "+k+"× "+f.pk[1];cost=k*pv;}else cost=n*pv;}
  else{q=Math.round(g)+(f.ml?" ml":" g");
   if(f.pk[0]){const k=Math.ceil(g/f.pk[0]);q+=" → "+k+"× "+f.pk[1];cost=k*pv;}else cost=g/1000*pv;}
  return{id,n:f.n,rep:f.rep,q,cost};}).sort((a,b)=>a.rep.localeCompare(b.rep)||a.n.localeCompare(b.n));
}

  const hasF=its.some(i=>FOODS[i.id].fr),hasH=its.some(i=>FOODS[i.id].ht);
  html+=`<div class="meal ${on?"eaten":""}"><div class="mh"><div><div class="slot">${SLOTS[s]}</div><div class="nm">${esc(m.n)}</div></div>
  <div class="btns"><button class="mini ${on?"on":""}" data-e="${mi}">${on?"✓ Mangiato":"Mangiato?"}</button><button class="mini" data-sw="${mi}">↻</button></div></div>
  ${its.map(i=>`<div class="food"><span>${esc(FOODS[i.id].n)}</span><em>${fmtQty(i.id,i.g)}</em></div>`).join("")}
  <div class="mm">${Math.round(mt.k)} kcal · P ${Math.round(mt.p)} g · C ${Math.round(mt.c)} g · G ${Math.round(mt.f)} g</div>
  ${hasF||hasH?`<div class="tags">${hasF?"❄ frigo ":""}${hasH?"♨ da scaldare":""}</div>`:""}</div>`;
 });
 html+=`</div><button class="btn ghost" id="regen">Rigenera la settimana</button>
 <p class="note">↻ cambia il pasto con un altro adatto. Valori nutrizionali medi da tabelle ed etichette tipiche: possono variare di marca in marca. Le quantità di olio, pane e pasta pesale le prime volte, poi vai a occhio.</p>`;
 $("#app").innerHTML=html;
 bindStale(vPiano);
 document.querySelectorAll("[data-d]").forEach(c=>c.onclick=()=>{S.day=c.dataset.d;save();vPiano();});
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const mi=b.dataset.e,e=S.eaten[S.day]=S.eaten[S.day]||{};if(e[mi])delete e[mi];else e[mi]=true;save();vPiano();});
 document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{const mi=+b.dataset.sw,s=slots[mi];
  const rr=rng(Date.now());let nid=null;
  for(let a=0;a<12;a++){const c=pickMeal(s,p,ids,rr);if(!c||c===ids[mi])continue;nid=c;const t=ids.slice();t[mi]=c;const q=solveDay(t.filter(Boolean),T);if(q.pOk&&q.kOk)break;}
  if(nid){ids[mi]=nid;if(S.eaten[S.day])delete S.eaten[S.day][mi];save();vPiano();}
  else{b.textContent="nessun altro";b.disabled=true;}});
 $("#regen").onclick=()=>{if(!p.giorni.length){go("profilo");return;}newPlan();vPiano();};
}

/* ===== SPESA ===== */
function spesaLists(){
 const p=S.profilo,PD=S.plan.days,days=Object.keys(PD);
 if(S.split&&days.length>=4){
  const h=Math.ceil(days.length/2),a=days.slice(0,h),b=days.slice(h);
  const rng2=ds=>dayLbl(ds[0])+(ds.length>1?"–"+dayLbl(ds[ds.length-1]):"");
  return[{k:"1",t:"Spesa 1 · per "+rng2(days),sub:"Dispensa per tutta la settimana + fresco per "+rng2(a),items:shopping(PD,days,p,(d,id)=>!isFresh(id)||a.includes(d))},
   {k:"2",t:"Spesa 2 · prima di "+dayLbl(b[0]),sub:"Solo fresco per "+rng2(b),items:shopping(PD,b,p,(d,id)=>isFresh(id))}];
 }
 return[{k:"a",t:"Spesa per "+days.length+(days.length===1?" giorno":" giorni"),sub:"",items:shopping(PD,days,p,()=>true)}];
}
function vSpesa(){
 if(!S.plan){$("#app").innerHTML=`<div class="empty">Genera prima il piano.<button class="btn" onclick="go('profilo')">Vai agli obiettivi</button></div>`;return;}
 const nDays=Object.keys(S.plan.days).length,lists=spesaLists();
 const grand=lists.reduce((a,l)=>a+l.items.reduce((b,x)=>b+x.cost,0),0),mine=Object.keys(S.prezzi).length;
 let html=staleBox();
 if(nDays>=4)html+=`<div class="card"><div class="chips"><span class="chip ${!S.split?"on":""}" data-sp="0">Una spesa</span><span class="chip ${S.split?"on":""}" data-sp="1">Due spese (fresco a metà settimana)</span></div></div>`;
 lists.forEach(L=>{let rep="",sub=0;
  html+=`<div class="card"><h2>${esc(L.t)}</h2>${L.sub?`<div class="mm" style="margin-top:-4px">${esc(L.sub)}</div>`:""}`;
  L.items.forEach(x=>{if(x.rep!==rep){rep=x.rep;html+=`<h3>${rep}</h3>`;}
   const ck=L.k+":"+x.id,on=!!S.check[ck],m=!!S.prezzi[x.id];sub+=x.cost;
   html+=`<div class="li ${on?"done":""}"><input type="checkbox" id="c-${ck}" data-c="${ck}" ${on?"checked":""}><label for="c-${ck}">${esc(x.n)}<small>${esc(x.q)}</small></label><button class="pr ${m?"mine":""}" data-p="${x.id}" title="Prezzo ${esc(unitLbl(x.id))}: tocca per cambiarlo">${eur(x.cost)}</button></div>`;});
  html+=`<div class="tot"><span class="mm">Stima ${lists.length>1?"di questa spesa":"totale"}</span><b>≈ ${eur(sub)}</b></div></div>`;});
 if(lists.length>1)html+=`<div class="card"><div class="tot" style="border:0;margin:0;padding:0"><span class="mm">Totale settimana</span><b>≈ ${eur(grand)}</b></div></div>`;
 html+=`<button class="btn" id="share">Condividi lista (WhatsApp…)</button><textarea id="sharetxt" readonly hidden></textarea><button class="btn ghost" id="clr">Azzera spunte</button>
 <div class="card"><h2>Come funzionano i prezzi</h2>
  <div class="mm">I prezzi di partenza sono <b>medie indicative</b> da supermercato, scritte nell'app: non vengono da internet e non si aggiornano da soli. Per avere una stima giusta:</div>
  <div class="mm">• <b>Tocca un prezzo</b> e scrivi quello che leggi sullo scontrino o sullo scaffale (per confezione, pezzo o kg, come indicato). Da lì in poi vale il tuo, evidenziato in arancione.</div>
  <div class="mm">• Per gli aumenti generali usa il <b>ritocco</b> qui sotto: +5% alza tutti i prezzi che non hai cambiato tu.</div>
  <div class="mm">• Olio, pane, miele e grana sono contati solo per la parte che usi.</div>
  <div class="row" style="align-items:end"><div><label>Ritocco prezzi base (%)</label><input id="corr" type="number" inputmode="numeric" value="${+S.corr||0}"></div>
  <button class="btn ghost sm" id="rstp" ${mine?"":"disabled"}>Cancella i miei ${mine||""} prezzi</button></div>
 </div>
 <p class="note">Le confezioni sono indicative. Fresco (yogurt, affettati, insalata) per più di 3–4 giorni: meglio fare due spese o usare la borsa frigo ben carica.</p>`;
 $("#app").innerHTML=html;
 bindStale(vSpesa);
 document.querySelectorAll("[data-sp]").forEach(c=>c.onclick=()=>{S.split=c.dataset.sp==="1";save();vSpesa();});
 document.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{S.check[c.dataset.c]=c.checked;save();vSpesa();});
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const id=b.dataset.p,f=FOODS[id];
  const v=prompt(`Prezzo di ${f.n} (${unitLbl(id)}), in euro.\nLascia vuoto per tornare al prezzo base.`,priceOf(id).toFixed(2).replace(".",","));
  if(v===null)return;const t=v.trim().replace(",",".");
  if(t===""){delete S.prezzi[id];}else{const n=parseFloat(t);if(!(n>0)){alert("Prezzo non valido");return;}S.prezzi[id]={v:Math.round(n*100)/100,d:new Date().toISOString().slice(0,10)};}
  save();vSpesa();});
 $("#corr").onchange=e=>{S.corr=clamp(+e.target.value||0,-50,200);save();vSpesa();};
 $("#rstp").onclick=()=>{if(confirm("Tornare ai prezzi base per tutti gli alimenti?")){S.prezzi={};save();vSpesa();}};
 $("#clr").onclick=()=>{S.check={};save();vSpesa();};
 $("#share").onclick=async()=>{let t="🛒 Spesa Rifornimento\n";
  lists.forEach(L=>{const left=L.items.filter(x=>!S.check[L.k+":"+x.id]);if(!left.length)return;
   if(lists.length>1)t+="\n— "+L.t+" —\n";let r="";
   left.forEach(x=>{if(x.rep!==r){r=x.rep;t+="\n*"+r+"*\n";}t+="• "+x.n+": "+x.q+"\n";});
   t+="\nStima: ≈ "+eur(left.reduce((a,x)=>a+x.cost,0))+"\n";});
  const b=$("#share");
  try{if(navigator.share){await navigator.share({text:t});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  try{await navigator.clipboard.writeText(t);b.textContent="✓ Lista copiata: incollala su WhatsApp";}
  catch(e){const ta=$("#sharetxt");ta.hidden=false;ta.value=t;ta.select();b.textContent="Copia il testo qui sotto";}};
}

render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.hostname)){try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}}
</script>
