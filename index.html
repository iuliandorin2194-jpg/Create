<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create</title>
<style>
  :root { --bg:#0b1a2e; --card:#13284a; --text:#eef3fa; --muted:#93a7c4; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  a.app { display:block; padding:16px; background:var(--card); border-radius:14px; color:var(--text); text-decoration:none; }
  a.app strong { display:block; font-size:17px; }
  a.app span { color:var(--muted); font-size:14px; }
  .empty { padding:24px; border:1px dashed var(--muted); border-radius:14px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Create</h1>
  <p class="sub">Laboratorio di app</p>
  <ul id="apps">
    <!-- Ogni nuova app viene aggiunta qui -->
    <li class="empty">Nessuna app ancora. La prima arriva presto.</li>
  </ul>
</main>
</body>
</html>
