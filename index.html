<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create</title>
<meta name="theme-color" content="#0b1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laboratorio">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#0b1a2e; --card:#13284a; --text:#eef3fa; --muted:#93a7c4; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  .top { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .top img { width:56px; height:56px; border-radius:14px; flex:none; }
  .top p.sub { margin:0; }
  a.app { position:relative; padding-right:64px !important; display:flex; align-items:center; gap:14px; padding:16px; background:var(--card); border-radius:14px; color:var(--text); text-decoration:none; }
  a.app .v { position:absolute; top:10px; right:12px; font-size:11px; color:var(--muted); border:1px solid #24406e; border-radius:999px; padding:1px 7px; }
  a.app img { width:48px; height:48px; border-radius:12px; flex:none; }
  a.app strong { display:block; font-size:17px; }
  a.app span { color:var(--muted); font-size:14px; }
  .empty { padding:24px; border:1px dashed var(--muted); border-radius:14px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>
  <div class="top"><img src="icon-192.png" alt=""><div><h1>Create</h1><p class="sub">Laboratorio di app</p></div></div>
  <ul id="apps">
    <!-- Ogni nuova app viene aggiunta qui -->
    <li><a class="app" href="impegni/"><img src="impegni/icon-192.png" alt=""><div><strong>Impegni</strong><span>Impegni giornalieri da camionista, riposi e conteggio mensile</span></div><small class="v" data-ver="impegni/"></small></a></li>
    <li><a class="app" href="rifornimento/"><img src="rifornimento/icon-192.png" alt=""><div><strong>Rifornimento</strong><span>Pasti a macro in cabina e in famiglia, ricette e lista della spesa</span></div><small class="v" data-ver="rifornimento/"></small></a></li>
  </ul>
</main>
<script>
// la versione la legge direttamente da ogni app, così è sempre quella pubblicata
document.querySelectorAll('[data-ver]').forEach(el => {
  fetch(el.dataset.ver + 'index.html', { cache: 'no-store' }).then(r => r.text()).then(t => {
    const m = t.match(/name="app-version" content="([^"·]+)/); if (m) el.textContent = 'v' + m[1].trim();
  }).catch(() => {});
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
